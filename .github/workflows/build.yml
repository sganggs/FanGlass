name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version

      - name: Build
        run: scripts/build.sh

      - name: Package
        run: scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanGlass
          path: build/FanGlass.app.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release cut by hand (with a locally built, smoke-tested zip) wins;
          # CI only fills in a release nobody created.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; leaving its assets alone"
          else
            gh release create "${GITHUB_REF_NAME}" build/FanGlass.app.zip \
              --title "FanGlass ${GITHUB_REF_NAME}" --generate-notes
          fi
